name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            artifact: mc-manager-linux-x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --bin mc-manager --target ${{ matrix.target }}
      - name: Copy binary
        run: |
          cp target/${{ matrix.target }}/release/mc-manager ${{ matrix.artifact }}
      - name: Calculate SHA256
        run: |
          sha256sum ${{ matrix.artifact }} > ${{ matrix.artifact }}.sha256
          cat ${{ matrix.artifact }}.sha256
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download x86_64 artifact
        uses: actions/download-artifact@v4
        with:
          name: mc-manager-linux-x86_64
          path: artifacts/x86_64
      - name: List files
        run: ls -la artifacts/x86_64/
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/x86_64/mc-manager-linux-x86_64
            artifacts/x86_64/mc-manager-linux-x86_64.sha256
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}