[package]
name = "Minecraft-Server-Manager-Rust"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "mc-manager"
path = "src/main.rs"

[[bin]]
name = "mc-manager-installer"
path = "src/bin/installer.rs"

[dependencies]
crossterm = "0.28"
ratatui = "0.28"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["blocking", "json"] }
nix = { version = "0.27", features = ["process", "signal"] }
sysinfo = "0.32"
crossbeam-channel = "0.5"
parking_lot = "0.12"
libc = "0.2"
dirs = "5"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
ctrlc = "3"
tokio = { version = "1.40", features = ["full"] }
flate2 = "1.0"
tar = "0.4"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"
opener = "0.6"
semver = "1.0"
inquire = "0.7"
which = "4.2"
directories = "5"
hex = "0.4"

[dev-dependencies]
tempfile = "3"
